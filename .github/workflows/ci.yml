name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 无依赖、无构建：插件只用 node: 内置模块
      - name: 语法检查
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check scripts/protocol.mjs
          node --check scripts/e2e-live.mjs
          node --check scripts/e2e-live-turns.mjs
      - name: 单元测试（纯函数 / 落盘格式 / fetch 包装 / 双协议端到端，不联网）
        run: node test/core.test.mjs
      - name: 宿主冒烟（假 ctx：路由 / 工具 / 命令 / 卸载残留）
        run: node test/host-smoke.mjs
      # 真 cordis 宿主测试需要 DSH 0.2.0 运行时的 cordis，CI 上没有就自动跳过（退出码 0）
      - name: 真 cordis 宿主测试（无运行时则跳过）
        run: node test/host-cordis.test.mjs
